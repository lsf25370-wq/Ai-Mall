# =====================================================
# 生产环境配置：全部依赖通过环境变量注入（Docker Compose 编排）
# 本地仍走 application.yml（默认 localhost）
# =====================================================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: 0

mybatis-plus:
  configuration:
    # 生产环境关闭 SQL 日志，避免性能损耗与敏感信息泄露
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true

mall:
  jwt:
    secret: ${JWT_SECRET:mall-project-jwt-secret-key-please-change-me-2026-08}
    expire-hours: 72
  ai:
    service-url: ${AI_SERVICE_URL:http://ai-service:8001}
  rate-limit:
    max: ${RATE_LIMIT_MAX:60}
    window-seconds: 60
  order:
    pay-timeout-minutes: 15
    auto-confirm-days: 7

logging:
  level:
    com.mall: info
